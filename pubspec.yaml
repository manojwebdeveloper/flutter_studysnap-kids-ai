name: studysnap_kids_ai
description: Scan worksheets into quizzes and flashcards — AI-powered learning for kids.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ───────────────────────────────────────────
  go_router: ^14.2.0

  # ── State management ─────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Code generation (immutable models) ───────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Local database (type-safe SQLite via Drift) ──────────
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Secure storage ────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # ── Networking ────────────────────────────────────────────
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.3

  # ── Environment config ────────────────────────────────────
  flutter_dotenv: ^5.1.0

  # ── Document scanning (native iOS VNDocumentCameraViewController) ──
  cunning_document_scanner: ^1.0.4

  # ── On-device OCR (privacy-first, no API cost) ───────────
  google_mlkit_text_recognition: ^0.13.0

  # ── Image handling ────────────────────────────────────────
  image: ^4.2.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0

  # ── Biometrics / Face ID for Parent PIN ──────────────────
  local_auth: ^2.2.0

  # ── Permissions ───────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Fonts ─────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Animations ────────────────────────────────────────────
  flutter_animate: ^4.5.0

  # ── UI utilities ──────────────────────────────────────────
  gap: ^3.0.1
  cached_network_image: ^3.4.0

  # ── Logging ───────────────────────────────────────────────
  logger: ^2.4.0

  # ── Utilities ─────────────────────────────────────────────
  uuid: ^4.4.2
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
